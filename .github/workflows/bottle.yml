name: bottle
# A formula bump has no `bottle do` block, so users build from source until
# this workflow commits one.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "fndr version to bottle (e.g. 0.0.1)"
        required: true
  push:
    branches: [main]
    paths:
      - Formula/fnd.rb

permissions:
  # Only `publish` writes.
  contents: read

jobs:
  resolve:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      needed: ${{ steps.v.outputs.needed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: v
        env:
          # Via env so the input can't be shell-injected.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The formula url is what gets built, so the version comes from it.
          # A dispatch input can only confirm it, never override it.
          formula_version=$(sed -n 's|^  url ".*/fndr-\(.*\)\.tar\.gz"$|\1|p' Formula/fnd.rb)
          [ -n "$formula_version" ] || { echo "::error::could not determine version from Formula/fnd.rb"; exit 1; }
          if [ -n "$INPUT_VERSION" ] && [ "$INPUT_VERSION" != "$formula_version" ]; then
            echo "::error::dispatch input '$INPUT_VERSION' != formula '$formula_version' — bump the formula first"
            exit 1
          fi
          ver="$formula_version"
          # Reject anything but a plain version (rc/post/dev suffixes allowed)
          # before it reaches a shell downstream.
          case "$ver" in
          *[!0-9A-Za-z.+-]*) echo "::error::refusing implausible version '$ver'"; exit 1 ;;
          esac
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          # A push that already has this version's bottles is this workflow's
          # own commit. A dispatch always rebuilds.
          if [ "$GITHUB_EVENT_NAME" = "push" ] && grep -q "fnd-bottles-$ver" Formula/fnd.rb; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::formula already bottled for $ver — nothing to do"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: resolve
    if: needs.resolve.outputs.needed == 'true'
    strategy:
      matrix:
        # A bottle pours only on its build macOS or newer: use the oldest
        # Homebrew supports. No Intel bottle.
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@main
      # The runner image links bin/openssl to openssl@1.1 outside brew, which
      # fails openssl@3's link step.
      - name: Remove the runner image's openssl@1.1 link
        run: |
          link="$(brew --prefix)/bin/openssl"
          if [[ "$(readlink "$link" || true)" == *openssl@1.1* ]]; then rm "$link"; fi
      - name: Link this checkout as the tap
        # `brew tap <name> <path>` fails on a remote mismatch; the symlink
        # makes brew use this checkout.
        run: |
          tap="$(brew --repository)/Library/Taps/ben-dev-au/homebrew-tap"
          rm -rf "$tap"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"
      - name: Build + bottle
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          brew install --build-bottle --verbose ben-dev-au/tap/fnd
          brew bottle --json --no-rebuild \
            --root-url="https://github.com/ben-dev-au/homebrew-tap/releases/download/fnd-bottles-$VERSION" \
            ben-dev-au/tap/fnd
      - uses: actions/upload-artifact@v7
        with:
          name: bottle-${{ matrix.os }}
          path: |
            *.bottle.tar.gz
            *.bottle.json

  publish:
    needs: [resolve, build]
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: Homebrew/actions/setup-homebrew@main
      - name: Link this checkout as the tap
        run: |
          tap="$(brew --repository)/Library/Taps/ben-dev-au/homebrew-tap"
          rm -rf "$tap"
          mkdir -p "$(dirname "$tap")"
          ln -s "$GITHUB_WORKSPACE" "$tap"
      - uses: actions/download-artifact@v8
        with:
          path: bottles
          merge-multiple: true
      - name: Merge bottle blocks into the formula
        run: brew bottle --merge --write --no-commit bottles/*.bottle.json
      - name: Upload bottles to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          tag="fnd-bottles-$VERSION"
          # brew writes `name--version`; root_url expects `name-version`.
          for f in bottles/*.bottle.tar.gz; do mv "$f" "${f/--/-}"; done
          gh release create "$tag" bottles/*.bottle.tar.gz --title "$tag" \
            --notes "fnd $VERSION bottles" \
            || gh release upload "$tag" bottles/*.bottle.tar.gz --clobber
      - name: Commit + push the bottle block
        # The checkout persists no credentials, so push with the token.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          git -c user.name="fnd-bottle-bot" -c user.email="actions@github.com" \
            commit -am "fnd $VERSION: bottles"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

  smoke:
    name: install from the published bottle
    needs: [resolve, publish]
    runs-on: macos-15
    steps:
      - uses: Homebrew/actions/setup-homebrew@main
      # The runner image links bin/openssl to openssl@1.1 outside brew, which
      # fails openssl@3's link step.
      - name: Remove the runner image's openssl@1.1 link
        run: |
          link="$(brew --prefix)/bin/openssl"
          if [[ "$(readlink "$link" || true)" == *openssl@1.1* ]]; then rm "$link"; fi
      - name: brew install from the tap
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # Tap from GitHub, not the checkout, to resolve the formula and
          # bottle URL a user gets.
          brew tap ben-dev-au/tap
          brew install ben-dev-au/tap/fnd
          out=$(fnd version 2>&1)
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qFx "$VERSION" \
            || { echo "::error::\`fnd version\` did not report $VERSION"; exit 1; }
          echo "Homebrew install OK: fnd $VERSION"

  report-failure:
    name: raise a tracking issue
    needs: [resolve, build, publish, smoke]
    # Any failure leaves `brew install` broken for users.
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          title="bottle: brew install is broken"
          body="The bottle workflow failed for fnd \`${VERSION:-unknown}\`: $RUN_URL

          \`brew install ben-dev-au/tap/fnd\` is broken for everyone until this is
          fixed — with no \`bottle do\` block on main, users fall back to a source
          build, which is what just failed.

          Re-run the workflow by hand once the formula is fixed."
          existing=$(gh issue list --search "$title in:title" --state open \
            --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
